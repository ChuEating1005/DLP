[project]
name = "dlp-lab6"
version = "0.1.0"
description = "DLP Lab6 - Conditional DDPM on iCLEVR"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy<2.0",
    "Pillow",
    "tqdm",
    "matplotlib",
    "diffusers>=0.31",
    "accelerate>=1.0",
    "einops",
    "wandb",
    "gdown",
    "ipykernel",
]

[tool.uv]
# Use the official PyTorch CUDA 12.4 wheels
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
